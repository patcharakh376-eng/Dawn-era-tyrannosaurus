name: Build jar
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 8
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 4.10.3
      - name: Unzip project
        run: unzip -o "dawnrex (2).zip"
      - name: Add llibrary
        run: cp llibrary-*.jar dawnrex/libs/llibrary-1.7.20.jar
      - name: Use Forge 2847
        run: sed -i 's/14.23.5.2860/14.23.5.2847/' dawnrex/build.gradle
      - name: Build
        working-directory: dawnrex
        run: gradle setupCIWorkspace build --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: dawnrex-jar
          path: dawnrex/build/libs/*.jar
