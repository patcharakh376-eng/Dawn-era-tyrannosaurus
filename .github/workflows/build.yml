name: Build jar

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 8

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 4.10.3

      - name: Unzip project
        run: |
          unzip -o "dawnrex (2).zip" -d temp_extract
          if [ -d "temp_extract/dawnrex" ]; then
            mv temp_extract/dawnrex ./dawnrex
          else
            mv temp_extract ./dawnrex
          fi
          rm -rf temp_extract

      - name: Add llibrary
        run: |
          mkdir -p dawnrex/libs
          cp llibrary-*.jar dawnrex/libs/llibrary-1.7.20.jar

      - name: Use Forge 2847
        run: sed -i 's/14.23.5.2860/14.23.5.2847/' dawnrex/build.gradle

      - name: Build
        working-directory: dawnrex
        run: gradle setupCIWorkspace build --no-daemon

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dawnrex-jar
          path: dawnrex/build/libs/*.jar